<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F1F5F9"/>

  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.5"/>

  <!-- Car Silhouette -->
  <g transform="translate(150, 200)">
    <!-- Body -->
    <path d="M 100 150 L 150 100 L 350 100 L 400 150 L 500 150 L 500 220 L 480 240 L 20 240 L 0 220 L 0 150 Z"
          fill="#94A3B8" opacity="0.3"/>

    <!-- Windows -->
    <path d="M 170 105 L 200 120 L 320 120 L 350 105 Z"
          fill="#CBD5E1" opacity="0.3"/>

    <!-- Wheels -->
    <circle cx="120" cy="240" r="35" fill="#64748B" opacity="0.3"/>
    <circle cx="120" cy="240" r="20" fill="#F1F5F9"/>
    <circle cx="380" cy="240" r="35" fill="#64748B" opacity="0.3"/>
    <circle cx="380" cy="240" r="20" fill="#F1F5F9"/>
  </g>

  <!-- Icon -->
  <g transform="translate(360, 120)">
    <circle cx="40" cy="40" r="35" fill="#DC2626" opacity="0.1"/>
    <path d="M 40 25 L 50 30 L 50 50 L 48 52 L 32 52 L 30 50 L 30 30 Z M 35 28 L 38 32 L 42 32 L 45 28 Z M 33 52 L 33 54 C 33 55.1 33.9 56 35 56 C 36.1 56 37 55.1 37 54 L 37 52 Z M 43 52 L 43 54 C 43 55.1 43.9 56 45 56 C 46.1 56 47 55.1 47 54 L 47 52 Z"
          fill="#DC2626" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle">
    Imagen no disponible
  </text>
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
    La imagen del vehículo no pudo cargarse
  </text>
</svg>
