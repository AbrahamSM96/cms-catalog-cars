# Render Blueprint — instancia #2 (banco de pruebas).
#
# Copia de ../render.yaml. Lo ÚNICO que cambia es `name`, porque los nombres de
# servicio son únicos dentro de la cuenta de Render: dos Blueprints creados desde
# el mismo archivo chocarían, y en el peor caso el segundo adoptaría el servicio
# del primero y le reescribiría las variables.
#
# Render no interpola variables en el campo `name`, así que la separación tiene
# que ser un archivo por instancia. Al crear el Blueprint hay que rellenar
# "Blueprint Path" con `infra/cms-catalog-cars-2.yaml`; el default (render.yaml
# en la raíz) es el de la instancia #1.
#
#   Render Dashboard > New > Blueprint > este repo > Blueprint Path > variables.
#
# MANTENIMIENTO: este archivo NO hereda de ../render.yaml. Cualquier cambio de
# infraestructura (versión de Bun, buildCommand, activar el preDeployCommand al
# pasar a un plan de pago) hay que replicarlo en AMBOS.
#
# La marca del cliente (nombre, logo, colores, SEO) NO se configura aquí: vive en
# el global `site-settings` del admin, en la base de datos de cada cliente.

services:
  - type: web
    name: cms-catalog-cars-2
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit

    # `bun install` omite las devDependencies cuando NODE_ENV es production, y
    # Render pone NODE_ENV=production en el runtime de Node. Sin este override el
    # build muere: tailwind, typescript y @swc son devDependencies.
    # El `bun run build` de después sí corre con NODE_ENV=production (heredado de
    # las envVars) y dispara el `prebuild` que copia los workers de MapLibre.
    buildCommand: NODE_ENV=development bun install --frozen-lockfile && bun run build

    # ┌─────────────────────────────────────────────────────────────────────┐
    # │ PENDIENTE: preDeployCommand — activar al pasar a un plan de pago.    │
    # └─────────────────────────────────────────────────────────────────────┘
    #
    # El plan `free` no ejecuta pre-deploy commands (ni da acceso al Shell), así
    # que HOY las migraciones NO corren solas. Hay que provisionar cada cliente a
    # mano, desde tu máquina, apuntando a la BD de ese cliente en Neon:
    #
    #   DATABASE_URI='<connection-string-del-cliente>' PAYLOAD_SECRET='x' bun run migrate
    #   DATABASE_URI='<connection-string-del-cliente>' PAYLOAD_SECRET='x' bun run seed
    #
    # Las comillas simples son obligatorias: la connection string de Neon lleva
    # `&`, y sin comillas el shell lo interpreta como "manda esto a background".
    #
    # Esto es OBLIGATORIO antes del primer arranque: en producción el adaptador
    # de Postgres nunca hace push del esquema, así que las tablas las crean
    # exclusivamente las migraciones de ../migrations. Sin ellas la app arranca
    # contra una BD vacía y muere en la primera query.
    #
    # Y OJO con el mantenimiento: cada migración nueva que agregues al repo hay
    # que correrla a mano contra CADA cliente ANTES de que Render despliegue el
    # código que la necesita. Si se olvida, el deploy sube código pidiendo una
    # columna que no existe.
    #
    # Al pasar a `plan: starter` (o superior), borra este bloque y descomenta la
    # línea de abajo — con eso el ciclo build → migrate+seed → start queda
    # automático, igual que el encadenado `migrate → seed → app` de
    # docker-compose.yml. Si el comando falla, el deploy entero falla y el
    # servicio sigue sirviendo el deploy anterior con cero downtime.
    #
    # Se invoca el CLI con `node` y no con `bun` a propósito: el CLI de Payload
    # carga la config TypeScript a través de tsx, que necesita un `node` real en
    # el PATH para resolver su propio loader (mismo motivo que la etapa
    # `migrator` del Dockerfile, que es Node y no Bun).
    #
    # preDeployCommand: node node_modules/payload/bin.js migrate && node node_modules/payload/bin.js run app/src/seed/run.ts

    startCommand: bun run start
    healthCheckPath: /

    envVars:
      # --- Toolchain ---------------------------------------------------------
      # El default de Bun en Render es viejo; se fija la misma versión que en
      # local para que el lockfile se resuelva igual.
      - key: BUN_VERSION
        value: 1.3.14
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: NODE_ENV
        value: production

      # --- Payload -----------------------------------------------------------
      # Render genera un secreto aleatorio de 256 bits al crear la instancia, y
      # lo deja fijo a partir de ahí. Cada cliente obtiene el suyo sin que nadie
      # tenga que acordarse de correr `openssl rand`.
      - key: PAYLOAD_SECRET
        generateValue: true
      # Explícito aunque NODE_ENV=production ya desactiva el push: el esquema lo
      # gobiernan las migraciones, nunca el arranque de la app.
      - key: PAYLOAD_DB_PUSH
        value: 'false'

      # --- Base de datos -----------------------------------------------------
      # Connection string de Neon, con ?sslmode=require.
      - key: DATABASE_URI
        sync: false

      # --- Almacenamiento de imágenes (Cloudflare R2) ------------------------
      # Credenciales de servidor: solo runtime, nunca llegan al bundle.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # --- Públicas (build time + runtime) -----------------------------------
      # Render inyecta las envVars del servicio también durante el build, que es
      # justo lo que estas dos necesitan: next.config.ts deriva de
      # NEXT_PUBLIC_R2_PUBLIC_URL el remotePattern de next/image, y el bundle de
      # cliente inlinea ambas. Ponerlas solo en runtime no basta.
      - key: NEXT_PUBLIC_R2_PUBLIC_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # --- Correo saliente (Resend) ------------------------------------------
      # Necesario para "¿Olvidaste tu contraseña?" en /admin. Se usa la API HTTP
      # (443) porque Render bloquea los puertos SMTP 25, 465 y 587.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
